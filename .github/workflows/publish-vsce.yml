name: Publish VS Code Marketplace

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package
      - name: Check Marketplace token
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing VSCE_PAT repository secret."
            exit 1
          fi
      - name: Publish
        working-directory: vscode-extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish -i git-triage-vscode.vsix -p "$VSCE_PAT"
